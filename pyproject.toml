[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast-poc-to-prod"
version = "0.1.0"
description = "Taking a forecasting model from notebook PoC to a tested, versioned, served API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hrutishaa Nanduti" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
