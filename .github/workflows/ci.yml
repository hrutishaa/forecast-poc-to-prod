name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -v
      - name: Train + register models (fails if pipeline breaks)
        run: python -m forecast.train
      - name: Rebuild live-demo data
        run: python scripts/export_demo.py
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t forecast .
      - name: Smoke-test the container API
        run: |
          docker run -d -p 8000:8000 --name api forecast
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/forecast -H 'Content-Type: application/json' \
            -d '{"series":"retail_sales","horizon":3}' | tee /dev/stderr | grep -q model_version
